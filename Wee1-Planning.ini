Week 1: Project Planning & Requirement Analysis
Phase 1: Requirement Gathering & Scope Definition
The goal of Phase 1 is to translate business needs into concrete, actionable engineering specifications before writing any code.

Step 1.1: Functional Requirements by User Persona
Define access boundaries and core actions using a Role-Based Access Control (RBAC) model.

                  ┌─────────────────────────────────┐
                  │          System Access          │
                  └────────────────┬────────────────┘
                                   │
         ┌─────────────────────────┼─────────────────────────┐
         ▼                         ▼                         ▼
     [ Admin ]                [ Employee ]              [ Customer ]
  • Full Control            • Operations                • Self-Service
  • System Settings         • Sales & CRM               • View Invoices
  • Payroll & HR            • Inventory Updates         • Make Payments
  • Financial Analytics     • Order Creation          • Profile Management

System Admin:

->Full CRUD control over all system entities (Users, Customers, Products, Invoices, HR).
->System setting configurations, role assignment, and audit log access.
->Access to high-level financial reports, profit & loss analytics, and AI insight controls.

Employee:

->Create and manage sales leads, customers, and CRM notes.
->Generate and process customer invoices.
->Update inventory stock logs (Stock-In / Stock-Out).
->Submit leave requests and view individual payslips.

Customer:

->View issued invoices and current payment statuses.
->Pay outstanding balances online via integrated payment gateways.
->Download payment receipts and PDF invoices.
->Update profile contact details.

