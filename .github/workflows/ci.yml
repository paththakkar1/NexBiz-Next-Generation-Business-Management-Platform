name: Monorepo CI Checks

on:
  push:
    branches: [ main, development, staging ]
  pull_request:
    branches: [ main, development, staging ]

jobs:
  server-ci:
    name: Backend Server CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Check Backend Build Syntax
        run: |
          cd server
          node -c src/app.js

  client-ci:
    name: Frontend Client CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build React Client
        run: |
          cd client
          CI=false npm run build

  ai-service-ci:
    name: Python AI Service CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Python Syntax
        run: |
          python -m compileall ai-service/
